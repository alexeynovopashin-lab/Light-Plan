<meta charset="utf-8"/>
<title>Знак фотостудии — сверка</title>
<style>
  body { background:#17150F; color:#B8B0A2; font:14px -apple-system,system-ui; margin:0; padding:20px; }
  h2 { font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:#8C8578; margin:20px 0 8px; font-weight:600; }
  .row { display:flex; align-items:flex-end; gap:26px; }
  svg { fill:none; stroke:#B8B0A2; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .s17 svg { width:17px; height:17px; }
  .s19 svg { width:19px; height:19px; }
  .s24 svg { width:24px; height:24px; }
  .s72 svg { width:72px; height:72px; }
  .btn { width:94px; height:56px; background:#221F19; border-radius:10px; display:flex;
         flex-direction:column; align-items:center; justify-content:center; gap:5px;
         color:#B8B0A2; font-size:12px; }
  .btn svg { width:17px; height:17px; }
  img { display:block; max-width:100%; }
</style>
<div id="host"></div>
<script>
const V = {
  "Принят — камера и прожектор с лучами":
    '<rect x="1" y="8.6" width="9.4" height="6" rx="1.7"/>'
  + '<circle cx="5.7" cy="11.6" r="1.6"/><circle cx="5.7" cy="11.6" r="0.5"/>'
  + '<path d="M5.7 14.6v1.8M2.6 21L5.7 16.4 8.8 21"/>'
  + '<path d="M13.4 4l6.8-2.2v7.4l-6.8-2.2z"/>'
  + '<path d="M16.8 9.2v7.8M14.6 21l2.2-4 2.2 4"/>'
  + '<path d="M21.2 2.8l2-1.2M21.6 5.6h1.8M21.2 8.4l2 1.2"/>'
};
const host = document.getElementById('host');
Object.entries(V).forEach(([name, d]) => {
  const wrap = document.createElement('div');
  const svg = (cls) => `<span class="${cls}"><svg viewBox="0 0 24 24">${d}</svg></span>`;
  wrap.innerHTML = `<h2>${name}</h2><div class="row">${svg('s72')}${svg('s24')}${svg('s19')}${svg('s17')}
    <span class="btn"><svg viewBox="0 0 24 24">${d}</svg><span>Фотостудия</span></span></div>`;
  host.appendChild(wrap);
});
</script>
