<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Песочница: диск светила</title>
<style>
  :root {
    --bg: #070606; --surface: #0F0E0C; --arc-mid: #EFEAE0;
    --hair: rgba(255,255,255,0.05); --ink: #EFEAE0; --ink-4: #8A8478;
    --hairline: #262320;
  }
  :root[data-theme="light"] {
    --bg: #EDE9E1; --surface: #FAF8F3; --arc-mid: #17150F;
    --hair: rgba(0,0,0,0.07); --ink: #17150F; --ink-4: #6B6559;
    --hairline: #E2DCD1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  .wrap { max-width: 430px; margin: 0 auto; padding: 12px 0 40px; }
  .card { background: var(--surface); margin-bottom: 10px; }
  .cap {
    display: flex; flex-direction: column; gap: 2px;
    padding: 10px 16px 0; font-size: 11px; letter-spacing: .3px; color: var(--ink-4);
  }
  .cap b { color: var(--ink); font-weight: 600; letter-spacing: 0; font-size: 13px; }
  .dome svg { display: block; width: 100%; }
  .nums {
    padding: 0 16px 12px; font-size: 11px; color: var(--ink-4);
    font-variant-numeric: tabular-nums;
  }
  .panel { padding: 14px 16px 0; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .row > label { font-size: 12px; color: var(--ink-4); min-width: 58px; flex-shrink: 0; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 32px;
    background: transparent; outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: var(--hairline); border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
    background: #D9AC6B; border: 3px solid var(--bg); margin-top: -11px;
  }
  .seg { display: flex; gap: 2px; background: var(--hairline); border-radius: 9px; padding: 2px; flex: 1; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--ink-4);
    font: inherit; font-size: 11px; padding: 7px 4px; border-radius: 7px; cursor: pointer;
    white-space: nowrap;
  }
  .seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; }
  .state { padding: 4px 16px 14px; font-size: 13px; }
  .state em { font-style: normal; color: var(--ink-4); }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <div class="row">
      <label>Сутки</label>
      <input type="range" id="sl" min="-110" max="1110" value="983">
    </div>
    <div class="row">
      <label>Тема</label>
      <div class="seg" id="segTheme">
        <button data-v="dark" class="on">Тёмная</button>
        <button data-v="light">Светлая</button>
      </div>
    </div>
    <div class="row">
      <label>Край</label>
      <div class="seg" id="segEdge">
        <button data-v="plain" class="on">как сейчас</button>
        <button data-v="rim">кант</button>
        <button data-v="dense">плотнее</button>
        <button data-v="ring">кольцо</button>
      </div>
    </div>
    <div class="row">
      <label>Тень</label>
      <div class="seg" id="segShade">
        <button data-v="drop">со смещением</button>
        <button data-v="flat" class="on">без смещения</button>
        <button data-v="need">по нужде</button>
        <button data-v="none">нет</button>
      </div>
    </div>
  </div>
  <div class="state" id="state"></div>

  <div class="card">
    <div class="cap"><b>Сейчас</b><span>плоский диск r16 · α .18 · тень со смещением на 3</span></div>
    <div class="dome" id="domeA"></div>
    <div class="nums" id="numsA"></div>
  </div>

  <div class="card">
    <div class="cap"><b>Предложение</b><span>тот же плоский диск, край и тень — переключателями</span></div>
    <div class="dome" id="domeB"></div>
    <div class="nums" id="numsB"></div>
  </div>

</div>

<script>
/* ------------------------------------------------------------------
   Песочница для одного вопроса: как выглядит светило на куполе.
   Геометрия дуги, палитра состояний и `vis` взяты из index.html один
   в один; время, погода и звёзды опущены — здесь сравнивают только
   диск и тень.

   Градиентного ореола здесь нет намеренно. Пробовали — отвергнуто:
   плоский диск с определённым краем читается как деталь прибора
   (аппликация на циферблате), растушёвка — как иллюстрация света.
   Это разные языки, и купол говорит на первом.
   ------------------------------------------------------------------ */

var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
var lerp = function (a, b, k) {
  k = clamp(k, 0, 1);
  return [Math.round(a[0]+(b[0]-a[0])*k), Math.round(a[1]+(b[1]-a[1])*k), Math.round(a[2]+(b[2]-a[2])*k)];
};
var rgb  = function (c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; };
var rgba = function (c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; };

var GOLD=[226,164,76], AMBER=[217,172,107], SILVER=[239,234,224], SCARLET=[216,80,47],
    PINK=[201,105,143], BLUE=[91,119,160], DEEP=[61,88,120], NIGHT=[104,126,168];

/* Копия stateAt() из index.html, подписи вписаны прямо */
function stateAt(e, morning) {
  if (e >= -0.833) {
    if (e > 40) return { c: SILVER, glow: 0.05, label: "Полдень" };
    if (e > 20) return { c: lerp(AMBER, SILVER, 0.6), glow: 0.08, label: morning ? "Утро" : "День" };
    if (e > 6.05) return { c: AMBER, glow: 0.16, label: morning ? "Тёплое утро" : "Вечереет" };
    return { c: GOLD, glow: 0.34, label: "Золотой час" };
  }
  var d = -e;
  if (d < 1.8)  return { c: lerp(GOLD, SCARLET, d/1.8), glow: 0.34, label: morning ? "Рассвет" : "Закат" };
  if (d < 4)    return { c: lerp(SCARLET, PINK, (d-1.8)/2.2), glow: 0.28, label: morning ? "Светает" : "Сумерки" };
  if (d < 6)    return { c: lerp(PINK, BLUE, (d-4)/2), glow: 0.24, label: "Синий час" };
  if (d < 12)   return { c: lerp(BLUE, DEEP, (d-6)/6), glow: 0.13, label: "Глубокие сумерки" };
  if (d < 18)   return { c: lerp(DEEP, NIGHT, (d-12)/6), glow: 0.06, label: "Астрономические сумерки" };
  return { c: NIGHT, glow: 0.04, label: "Ночь" };
}

/* Дуга купола: M 32 196 A 163 148 0 0 1 358 196 — эллипс с центром (195,196).
   s = 0 восход, s = 1 закат; за отрезком светило уходит под горизонт */
var CX = 195, CY = 196, RX = 163, RY = 148, MAXALT = 55;
function posAt(s) {
  var th = Math.PI * (1 - s);
  return [CX + RX * Math.cos(th), CY - RY * Math.sin(th)];
}
function elevAt(s) { return MAXALT * Math.sin(Math.PI * s); }

/* Светлота по WCAG — ею меряется, насколько ядро пропадает на светлом фоне */
function lum(c) {
  var f = function (v) { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(c[0]) + 0.7152*f(c[1]) + 0.0722*f(c[2]);
}
var L_LIGHT_SURFACE = lum([250, 248, 243]);   // --surface светлой темы, #FAF8F3

/* Тень нужна ровно настолько, насколько ядро пропадает на светлом.
   В полдень оно белое на белом — на полную; в золотой час отделяется
   само — в ноль. Тема сюда не входит: сколько тени считает код по цвету,
   есть ли она вообще — решает класс .lit-shade */
function shadeNeed(st) {
  return clamp((0.42 - (L_LIGHT_SURFACE - lum(st.c))) / 0.30, 0, 1);
}

function domeSVG(id) {
  return '<svg viewBox="0 0 390 240">'
    + '<defs>'
    +   '<linearGradient id="day_'+id+'" x1="0" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">'
    +     '<stop offset="0%" stop-color="#E2A44C"/><stop offset="10%" stop-color="#E2A44C"/>'
    +     '<stop offset="30%" stop-color="var(--arc-mid)" stop-opacity="0.28"/>'
    +     '<stop offset="70%" stop-color="var(--arc-mid)" stop-opacity="0.28"/>'
    +     '<stop offset="90%" stop-color="#E2A44C"/><stop offset="100%" stop-color="#E2A44C"/>'
    +   '</linearGradient>'
    +   '<radialGradient id="hz_'+id+'" cx="50%" cy="50%" r="50%">'
    +     '<stop id="hz0_'+id+'" offset="0%" stop-color="#D9AC6B" stop-opacity="0.32"/>'
    +     '<stop id="hz1_'+id+'" offset="100%" stop-color="#D9AC6B" stop-opacity="0"/>'
    +   '</radialGradient>'
    +   '<radialGradient id="shade_'+id+'" cx="50%" cy="50%" r="50%">'
    +     '<stop offset="42%" stop-color="rgba(23,21,15,0.42)"/>'
    +     '<stop offset="100%" stop-color="rgba(23,21,15,0)"/>'
    +   '</radialGradient>'
    +   '<clipPath id="above_'+id+'"><rect x="0" y="0" width="390" height="196"/></clipPath>'
    + '</defs>'
    + '<ellipse id="hz_e_'+id+'" cy="196" rx="130" ry="62" fill="url(#hz_'+id+')" clip-path="url(#above_'+id+')"/>'
    + '<line x1="18" y1="196" x2="372" y2="196" stroke="var(--hair)" stroke-width="1" stroke-dasharray="4 5"/>'
    + '<path d="M 32 196 A 163 148 0 0 1 358 196" fill="none" stroke="url(#day_'+id+')" stroke-width="3" stroke-linecap="round"/>'
    + '<circle id="shd_'+id+'" r="14.5" fill="url(#shade_'+id+')" opacity="0"/>'
    + '<circle id="halo_'+id+'" r="16"/>'
    + '<circle id="core_'+id+'" r="6.5" fill="#D9AC6B" stroke="var(--surface)" stroke-width="2.5"/>'
    + '</svg>';
}

document.getElementById("domeA").innerHTML = domeSVG("a");
document.getElementById("domeB").innerHTML = domeSVG("b");
var $ = function (id) { return document.getElementById(id); };

var theme = "dark", edge = "plain", shade = "flat";

function paint(id, proposal, s, st, vis) {
  var p = posAt(s), col = rgb(st.c);

  $("core_" + id).setAttribute("cx", p[0].toFixed(1));
  $("core_" + id).setAttribute("cy", p[1].toFixed(1));
  $("core_" + id).setAttribute("fill", col);
  $("core_" + id).setAttribute("opacity", vis.toFixed(2));

  /* Диск остаётся плоским во всех вариантах — меняется только то,
     чем обозначен его край */
  var halo = $("halo_" + id), mode = proposal ? edge : "plain";
  var a = (mode === "dense" ? 0.26 : 0.18) * vis;
  halo.setAttribute("cx", p[0].toFixed(1));
  halo.setAttribute("cy", p[1].toFixed(1));
  halo.setAttribute("r", 16);
  halo.setAttribute("fill", mode === "ring" ? "none" : rgba(st.c, a.toFixed(3)));
  halo.setAttribute("stroke", (mode === "rim" || mode === "ring") ? col : "none");
  halo.setAttribute("stroke-opacity", (mode === "ring" ? 0.40 * vis : 0.34 * vis).toFixed(3));
  halo.setAttribute("stroke-width", mode === "ring" ? 1.4 : 1);

  var shd = $("shd_" + id), m = proposal ? shade : "drop", o = 0;
  if (theme === "light") {
    if (m === "drop" || m === "flat") o = vis;
    else if (m === "need") o = vis * shadeNeed(st);
  }
  shd.setAttribute("cx", p[0].toFixed(1));
  shd.setAttribute("cy", (m === "drop" ? p[1] + 3 : p[1]).toFixed(1));
  shd.setAttribute("opacity", o.toFixed(2));

  // Зарево горизонта — одинаковое в обеих половинах, его не трогаем
  var glowK = theme === "light" ? 0.42 : 1;
  $("hz_e_" + id).setAttribute("cx", clamp(p[0], 60, 330).toFixed(1));
  $("hz0_" + id).setAttribute("stop-color", col);
  $("hz0_" + id).setAttribute("stop-opacity", clamp(st.glow * glowK, 0, 1).toFixed(2));
  $("hz1_" + id).setAttribute("stop-color", col);

  $("nums" + id.toUpperCase()).textContent =
    "диск r16 · " + (mode === "ring" ? "кольцо" : "α " + a.toFixed(3))
    + (mode === "rim" ? " + кант" : "")
    + " · тень " + (theme === "light" ? o.toFixed(2) + (m === "drop" ? " со смещением" : "") : "нет (тёмная тема)");
}

function render() {
  var s = +$("sl").value / 1000;
  var e = elevAt(s), st = stateAt(e, s < 0.5);
  var vis = e < 0 ? Math.max(0, 1 - (-e / 3)) : 1;

  $("state").innerHTML = "<b>" + st.label + "</b> &nbsp; <em>высота "
    + e.toFixed(1) + "° · разрыв по светлоте " + (L_LIGHT_SURFACE - lum(st.c)).toFixed(2) + "</em>";

  paint("a", false, s, st, vis);
  paint("b", true,  s, st, vis);
}

$("sl").addEventListener("input", render);

function seg(elId, set) {
  $(elId).addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    set(b.dataset.v);
    $(elId).querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    render();
  });
}
seg("segTheme", function (v) { theme = v; document.documentElement.setAttribute("data-theme", v); });
seg("segEdge",  function (v) { edge = v; });
seg("segShade", function (v) { shade = v; });
render();
</script>
</body>
</html>
