<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Light Plan β">
  <title>Light Plan β</title>
  <!-- Знак беты. Тот же рисунок, что у корня (`../icon.svg`), плюс латунный
       кружок с «B» — как на `beta/icon-*.png`, по которым и снята геометрия:
       кружок #E2A44C, центр (385, 383), радиус 99; буква 85 × 103.
       Свой файл нужен потому, что `index.html` общий на оба канала и ссылается
       на `icon.svg` рядом с собой: в корне это корневой знак, в бете — этот.
       Меняешь корневой рисунок — поправь и здесь: копией он не обновляется
       (хвосты, заход В). -->
  <defs>
    <!-- Плитка: тёмная, но не чёрная — «вечер», а не пустота -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1712"/>
      <stop offset="1" stop-color="#0D0B09"/>
    </linearGradient>
    <!-- Зарево у горизонта: свет ощущается температурой, а не лучами -->
    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientTransform="translate(302 356) rotate(90) scale(96 138)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2A44C" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#C9853F" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#C9853F" stop-opacity="0"/>
    </radialGradient>
    <!-- Диск солнца: горячее ядро к тёплому краю -->
    <radialGradient id="sun" cx="0" cy="0" r="1"
      gradientTransform="translate(302 356) rotate(90) scale(44)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9BE"/>
      <stop offset="0.6" stop-color="#F3C275"/>
      <stop offset="1" stop-color="#E2A44C"/>
    </radialGradient>
    <!-- Латунь дуги: светлее сверху, гуще у горизонта -->
    <linearGradient id="brass" x1="0" y1="106" x2="0" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9853F"/>
      <stop offset="0.45" stop-color="#E2A44C"/>
      <stop offset="1" stop-color="#F0C883"/>
    </linearGradient>
    <!-- Земля скрывает всё, что село за горизонт -->
    <clipPath id="aboveGround">
      <path d="M0 0h512v356H0z"/>
    </clipPath>
  </defs>

  <!-- Плитка. Для maskable-иконки фон занимает весь холст -->
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <g clip-path="url(#aboveGround)">
    <!-- Зарево над точкой заката -->
    <ellipse cx="302" cy="356" rx="138" ry="96" fill="url(#glow)"/>

    <!-- Полный круг светила: солнце и луна — один цикл -->
    <circle cx="256" cy="234" r="142" fill="none" stroke="url(#brass)" stroke-width="7"/>

    <!-- Солнце садится: диск наполовину за горизонтом -->
    <circle cx="308" cy="352" r="42" fill="url(#sun)"/>

    <!-- Рельеф: цельная гряда, солнце тонет за её правым склоном -->
    <path d="M108 356c30-4 50-26 74-52 20-22 42-14 58 12 12 20 24 34 40 42"
      fill="none" stroke="url(#brass)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Луна на дуге: тот же круг, другое светило -->
  <circle cx="348" cy="132" r="30" fill="#0D0B09"/>
  <circle cx="348" cy="132" r="26" fill="#D9DEE6"/>
  <circle cx="339" cy="125" r="6" fill="#C2C9D3" opacity="0.55"/>
  <circle cx="355" cy="141" r="4.5" fill="#C2C9D3" opacity="0.45"/>
  <circle cx="354" cy="122" r="3" fill="#C2C9D3" opacity="0.4"/>

  <!-- Горизонт: линия, а не иллюстрация -->
  <path d="M76 356h360" fill="none" stroke="url(#brass)" stroke-width="7" stroke-linecap="round"/>

  <!-- Метка канала: латунный кружок поверх заката, в нём чёрная «B».
       Стоит последним — закрывает собой и солнце, и горизонт, как на PNG -->
  <circle cx="385" cy="383" r="99" fill="#E2A44C"/>
  <path fill="#0F0E0C" fill-rule="evenodd" d="
    M344 333 H393 C412 333 425 343 425 358 C425 369 419 377 409 381
    C421 385 430 395 430 409 C430 425 415 436 394 436 H344 Z
    M367 352 H390 C399 352 404 355 404 362 C404 369 399 373 390 373 H367 Z
    M367 394 H392 C403 394 409 399 409 407 C409 415 403 419 392 419 H367 Z"/>
</svg>
