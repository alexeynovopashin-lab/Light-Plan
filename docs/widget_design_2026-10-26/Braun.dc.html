<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 848px; height: 500px; box-sizing: border-box; padding: 40px; background: #9aa39b; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; row-gap: 32px; align-content: start; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; color: #1f1e1b"><span style="font-weight: 600">Braun, белый</span> · нейтральный серый, чёрные чернила, жёлтое — текущая точка</div>
<dc-import name="Widget" scenario="lunch" theme="light" size="pro" hint-size="364px,170px"></dc-import>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; color: #1f1e1b"><span style="font-weight: 600">Braun, чёрный</span> · белые чернила, жёлтое — текущая точка</div>
<dc-import name="Widget" scenario="lunch" theme="braunDark" size="pro" hint-size="364px,170px"></dc-import>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; color: #1f1e1b"><span style="font-weight: 600">Braun, белый</span> · студия 13:57, «0 мин»</div>
<dc-import name="Widget" scenario="studioAfter" theme="light" size="pro" hint-size="364px,170px"></dc-import>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; color: #1f1e1b"><span style="font-weight: 600">Малый</span> · Braun белый и чёрный</div>
<div style="display: flex; gap: 24px">
<dc-import name="Widget" scenario="lunch" theme="light" size="small" hint-size="170px,170px"></dc-import>
<dc-import name="Widget" scenario="lunch" theme="braunDark" size="small" hint-size="170px,170px"></dc-import>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":848,"height":500}}'>
