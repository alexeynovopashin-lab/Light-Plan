<helmet>
<style>
body{margin:0}
.lp{--bg:#0a0a0b;--tile:#161618;--hi:rgba(255,255,255,.09);--sh:0 10px 28px rgba(0,0,0,.55);--ink:#f5f3ee;--ink2:rgba(245,243,238,.68);--ink3:rgba(245,243,238,.56);--tick:rgba(245,243,238,.17);--grain:.09;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}

<div><p class="cap">100 · отлично — полная капсула, длинное отражение</p><dc-import name="SunsetTile" score="100" hint-size="361px,196px"></dc-import></div>
</div>
<div class="lp" data-theme="light" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding: 24px; height: 272px; box-sizing: border-box">
<div><p class="cap">0 · светлая тема</p><dc-import name="SunsetTile" score="0" hint-size="361px,196px"></dc-import></div>
<div><p class="cap">34</p><dc-import name="SunsetTile" score="34" hint-size="361px,196px"></dc-import></div>
<div><p class="cap">45</p><dc-import name="SunsetTile" score="45" hint-size="361px,196px"></dc-import></div>
<div><p class="cap">100</p><dc-import name="SunsetTile" score="100" hint-size="361px,196px"></dc-import></div>

</div>
