<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Небо над дугой — состояния</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.cap{margin:0 0 8px;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:13px;line-height:20px;color:rgba(245,243,238,.68)}
.crop{width:393px;height:440px;overflow:hidden;border-radius:20px}
</style>
</helmet>
<div style="width: 1275px; height: 1032px; box-sizing: border-box; padding: 24px; background: #0a0a0b; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<div><p class="cap">Ясный день, облаков 0 % — голубое небо</p><div class="crop"><dc-import name="Main" phase="day" clouds="0" frame="screen" hint-size="393px,852px"></dc-import></div></div>
<div><p class="cap">Серый день, облаков 100 % — без цвета</p><div class="crop"><dc-import name="Main" phase="day" clouds="100" frame="screen" hint-size="393px,852px"></dc-import></div></div>
<div><p class="cap">Рассвет, облаков 20 % — заря слева, гаснут звёзды</p><div class="crop"><dc-import name="Main" phase="dawn" clouds="20" frame="screen" hint-size="393px,852px"></dc-import></div></div>
<div><p class="cap">Закат, ясно (10 %) — полная заря</p><div class="crop"><dc-import name="Main" phase="evening" clouds="10" frame="screen" hint-size="393px,852px"></dc-import></div></div>
<div><p class="cap">Закат сегодня, облаков 70 % — заря приглушена</p><div class="crop"><dc-import name="Main" phase="evening" clouds="70" frame="screen" hint-size="393px,852px"></dc-import></div></div>
<div><p class="cap">Ночь, ясно (10 %) — звёзды, солнце призраком под горизонтом</p><div class="crop"><dc-import name="Main" phase="night" clouds="10" frame="screen" hint-size="393px,852px"></dc-import></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1275,"height":1032}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
